<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teka-Teki MTK</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
<style>
:root{--bg:#e9f0f5;--line:#c9d8e4;--paper:#fbfdfe;--ink:#1b2f4b;--soft:#5b6f86;--accent:#d1495b;--ok:#2e7d4f;--btn:#1b2f4b;--btnink:#fbfdfe;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f3b35;--line:#2c4f47;--paper:#264840;--ink:#f2efe2;--soft:#b9c7bd;--accent:#f4a259;--ok:#a7d676;--btn:#f4d35e;--btnink:#1f3b35;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f3b35;--line:#2c4f47;--paper:#264840;--ink:#f2efe2;--soft:#b9c7bd;--accent:#f4a259;--ok:#a7d676;--btn:#f4d35e;--btnink:#1f3b35;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:"Patrick Hand","Segoe Print","Comic Sans MS",cursive,sans-serif;font-size:20px;line-height:1.4;display:flex;justify-content:center;padding:20px 14px}
main{width:100%;max-width:520px}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:22px 20px;box-shadow:5px 5px 0 var(--ink)}
h1{margin:0 0 6px;font-size:2.1rem;font-weight:400}
p{margin:0 0 14px}
.soft{color:var(--soft)}
.bar{display:flex;justify-content:space-between;margin-bottom:12px;font-size:1.05rem}
.track{height:10px;border:2px solid var(--ink);border-radius:6px;overflow:hidden;margin-bottom:18px}
.fill{height:100%;width:0;background:var(--ok);transition:width .3s}
.type{font-size:1rem;color:var(--soft);margin-bottom:6px}
.q{font-size:1.7rem;line-height:1.35;margin-bottom:18px;min-height:3.6em}
.row{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1 1 120px;min-width:0;font:inherit;font-size:1.6rem;padding:8px 12px;border:2px solid var(--ink);border-radius:10px;background:transparent;color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;font-size:1.2rem;padding:10px 18px;border:2px solid var(--ink);border-radius:10px;background:var(--btn);color:var(--btnink);cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
.msg{min-height:2.6em;margin-top:14px;font-size:1.15rem}
.msg.ok{color:var(--ok)}.msg.no{color:var(--accent)}
.big{font-size:3.4rem;line-height:1;margin:8px 0}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<main>
  <div class="card" id="app"></div>
</main>
<script>
var TOTAL = 10;
var app = document.getElementById("app");
var state;

function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(arr) { return arr[rnd(0, arr.length - 1)]; }

// Setiap generator mengembalikan {type, text, answer, hint}
var gens = [
  function () { // pola tambah/kurang
    var a = rnd(2, 20), d = pick([2, 3, 4, 5, 6, 7, 9, -2, -3]), n = 6, miss = rnd(1, 4), s = [], i;
    if (d < 0) a += 30;
    for (i = 0; i < n; i++) s.push(a + d * i);
    var ans = s[miss]; s[miss] = "?";
    return { type: "Pola bilangan", text: s.join(", "), answer: ans,
      hint: "Lihat selisih dua bilangan yang bersebelahan. Selisihnya selalu sama." };
  },
  function () { // pola kali
    var a = rnd(1, 5), r = pick([2, 3]), s = [], i, miss = rnd(1, 3);
    for (i = 0; i < 5; i++) s.push(a * Math.pow(r, i));
    var ans = s[miss]; s[miss] = "?";
    return { type: "Pola bilangan", text: s.join(", "), answer: ans,
      hint: "Setiap bilangan dikali bilangan yang sama untuk mendapat bilangan berikutnya." };
  },
  function () { // persamaan hilang
    var a = rnd(6, 60), b = rnd(3, 40), k = rnd(0, 3);
    if (k === 0) return { type: "Isi yang hilang", text: a + " + ? = " + (a + b), answer: b, hint: "Kurangi " + (a + b) + " dengan " + a + "." };
    if (k === 1) return { type: "Isi yang hilang", text: "? − " + b + " = " + a, answer: a + b, hint: "Lawan dari mengurangi adalah menambah." };
    if (k === 2) { var x = rnd(3, 12), y = rnd(3, 12); return { type: "Isi yang hilang", text: x + " × ? = " + (x * y), answer: y, hint: "Bagi " + (x * y) + " dengan " + x + "." }; }
    var p = rnd(3, 12), q = rnd(3, 12); return { type: "Isi yang hilang", text: "? ÷ " + p + " = " + q, answer: p * q, hint: "Lawan dari membagi adalah mengalikan." };
  },
  function () { // aku bilangan berapa
    var x = rnd(2, 15), m = rnd(2, 5), c = rnd(2, 12);
    return { type: "Aku bilangan berapa?", text: "Jika aku dikali " + m + " lalu ditambah " + c + ", hasilnya " + (x * m + c) + ". Aku bilangan berapa?", answer: x,
      hint: "Balik langkahnya: kurangi " + c + " dulu, lalu bagi " + m + "." };
  },
  function () { // jumlah dan selisih
    var big = rnd(10, 40), small = rnd(2, big - 2);
    return { type: "Dua bilangan", text: "Dua bilangan berjumlah " + (big + small) + " dan selisihnya " + (big - small) + ". Berapa bilangan yang lebih besar?", answer: big,
      hint: "Bilangan besar = (jumlah + selisih) ÷ 2." };
  },
  function () { // keliling persegi
    var s = rnd(3, 20);
    return { type: "Bangun datar", text: "Keliling sebuah persegi " + (4 * s) + " cm. Berapa panjang satu sisinya (cm)?", answer: s,
      hint: "Persegi punya 4 sisi sama panjang. Bagi kelilingnya dengan 4." };
  }
];

function newQuestion() { return pick(gens)(); }

function start() {
  state = { n: 0, score: 0, right: 0, hinted: false, answered: false, q: null };
  next();
}

function next() {
  if (state.n >= TOTAL) return finish();
  state.n++;
  state.hinted = false;
  state.answered = false;
  state.q = newQuestion();
  renderQ();
}

function renderQ() {
  var q = state.q;
  app.innerHTML =
    '<div class="bar"><span>Soal ' + state.n + ' dari ' + TOTAL + '</span><span>Skor: ' + state.score + '</span></div>' +
    '<div class="track"><div class="fill" style="width:' + ((state.n - 1) / TOTAL * 100) + '%"></div></div>' +
    '<div class="type">' + q.type + '</div>' +
    '<div class="q">' + q.text + '</div>' +
    '<div class="row"><input id="ans" type="number" inputmode="numeric" aria-label="Jawabanmu" autocomplete="off">' +
    '<button id="go">Periksa</button></div>' +
    '<div class="row" style="margin-top:10px"><button class="ghost" id="hint">Petunjuk (−5 poin)</button></div>' +
    '<div class="msg" id="msg" role="status"></div>';
  var inp = document.getElementById("ans");
  inp.focus();
  document.getElementById("go").onclick = check;
  document.getElementById("hint").onclick = showHint;
  inp.onkeydown = function (e) { if (e.key === "Enter") check(); };
  requestAnimationFrame(function () { var f = document.querySelector(".fill"); if (f) f.style.width = (state.n / TOTAL * 100) + "%"; });
  var fill = document.querySelector(".fill");
  if (fill) fill.style.width = ((state.n - 1) / TOTAL * 100) + "%";
}

function setMsg(text, cls) {
  var m = document.getElementById("msg");
  m.textContent = text;
  m.className = "msg " + (cls || "");
}

function showHint() {
  state.hinted = true;
  setMsg("Petunjuk: " + state.q.hint, "");
}

function check() {
  if (state.answered) return;
  var inp = document.getElementById("ans");
  if (inp.value.trim() === "") { setMsg("Tulis jawabanmu dulu.", "no"); return; }
  var val = Number(inp.value);
  state.answered = true;
  inp.disabled = true;
  document.getElementById("go").disabled = true;
  var go = document.getElementById("go");
  if (val === state.q.answer) {
    var pts = state.hinted ? 5 : 10;
    state.score += pts; state.right++;
    setMsg("Benar! +" + pts + " poin.", "ok");
  } else {
    setMsg("Belum tepat. Jawaban yang benar: " + state.q.answer + ".", "no");
  }
  var btn = document.createElement("button");
  btn.textContent = state.n >= TOTAL ? "Lihat hasil" : "Soal berikutnya";
  btn.onclick = next;
  btn.style.marginTop = "12px";
  document.getElementById("msg").after(btn);
  btn.focus();
}

function finish() {
  var pct = state.right / TOTAL;
  var title = pct === 1 ? "Sempurna!" : pct >= 0.7 ? "Hebat!" : pct >= 0.4 ? "Lumayan, terus berlatih!" : "Ayo coba lagi!";
  app.innerHTML =
    '<h1>' + title + '</h1>' +
    '<div class="big">' + state.score + '</div>' +
    '<p>Skor dari maksimal ' + (TOTAL * 10) + '. Kamu menjawab benar ' + state.right + ' dari ' + TOTAL + ' soal.</p>' +
    '<button id="again">Main lagi</button>';
  document.getElementById("again").onclick = start;
}

function home() {
  app.innerHTML =
    '<h1>Teka-Teki MTK</h1>' +
    '<p class="soft">Selesaikan ' + TOTAL + ' soal: pola bilangan, angka yang hilang, dan teka-teki cerita pendek.</p>' +
    '<p>Jawaban benar dapat 10 poin. Pakai petunjuk, poinnya jadi 5.</p>' +
    '<button id="play">Mulai main</button>';
  document.getElementById("play").onclick = start;
}

home();
</script>
</body>
</html>
